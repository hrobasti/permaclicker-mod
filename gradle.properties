# Standalone build settings. Minecraft/Java/loader versions are not set here:
# they are read from config/matrix-targets.json (see gradle/matrix-defaults.gradle).
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true

# false: compile against the TurtleLib core jar from its GitHub release (version in
# version.properties). true: use a sibling ../turtle-lib-mod checkout as source project.
useLocalTurtleLib=false
