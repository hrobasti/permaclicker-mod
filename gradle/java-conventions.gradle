// Java toolchain and compiler settings shared by all modules of this repository. These used
// to come only from the workspace root build, which left standalone checkouts unconfigured.

apply plugin: 'eclipse'

// Configures the calling module for the given matrix target and returns the effective Java
// version (an explicit -Pjava_language_version wins over the target's 'java' value).
ext.applyJavaConventions = { Map matrixTarget ->
    int javaVersion = Integer.parseInt(
        providers.gradleProperty('java_language_version').getOrElse(matrixTarget.java.toString())
    )

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = javaVersion
    }

    registerNullAnalysis(javaVersion)

    javaVersion
}

// JSpecify null analysis with the Eclipse compiler and the same rules as VS Code
// (config/jdt_null_analysis.prefs); javac ignores these annotations, so without this gate
// new warnings would only show up in the editor.
def ecjVersion = '3.46.100'
def nullAnalysisPrefs = file('../config/jdt_null_analysis.prefs')

ext.registerNullAnalysis = { int javaVersion ->
    def ecjClasspath = configurations.detachedConfiguration(dependencies.create("org.eclipse.jdt:ecj:${ecjVersion}"))
    def nullCheck = tasks.register('nullCheck') {
        group = 'verification'
        description = 'Fails on JSpecify null-analysis warnings in all source sets of this module.'
    }
    tasks.matching { it.name == 'check' }.configureEach { dependsOn(nullCheck) }

    sourceSets.configureEach { sourceSet ->
        def taskName = sourceSet.getTaskName('nullCheck', null)
        def javaSources = sourceSet.java
        // Lazy: build scripts may replace the classpath after this source set is created.
        def compileClasspath = files({ sourceSet.compileClasspath })
        def checkTask = tasks.register(taskName, JavaExec) {
            group = 'verification'
            description = "Null analysis of the ${sourceSet.name} source set with the Eclipse compiler."
            onlyIf { !javaSources.isEmpty() }
            inputs.files(javaSources).skipWhenEmpty()
            inputs.files(compileClasspath)
            inputs.file(nullAnalysisPrefs)
            def marker = layout.buildDirectory.file("nullCheck/${sourceSet.name}.ok")
            outputs.file(marker)
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(javaVersion) }
            classpath = ecjClasspath
            mainClass = 'org.eclipse.jdt.internal.compiler.batch.Main'
            argumentProviders.add({
                [
                    '--release', javaVersion.toString(),
                    '-encoding', 'UTF-8',
                    '-proc:none',
                    '-d', 'none',
                    '-warn:none',
                    '-properties', nullAnalysisPrefs.absolutePath,
                    '-failOnWarning',
                    '-classpath', compileClasspath.asPath
                ] + javaSources.srcDirs.findAll { it.exists() }.collect { it.absolutePath }
            } as CommandLineArgumentProvider)
            doLast { marker.get().asFile.text = 'ok\n' }
        }
        nullCheck.configure { dependsOn(checkTask) }
    }
}
