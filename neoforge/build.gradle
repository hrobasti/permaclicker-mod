plugins {
    id 'net.neoforged.moddev' version '2.0.147'
}

apply from: file('../gradle/matrix-defaults.gradle')
apply from: file('../gradle/java-conventions.gradle')
apply from: file('../gradle/mod-info.gradle')
apply from: file('../gradle/turtlelib-dependency.gradle')
def matrixTarget = resolveMatrixTarget('minecraft_version')
def resolvedJavaLanguageVersion = applyJavaConventions(matrixTarget).toString()

// Explicit -P values (passed per target by the matrix release builds) win over the matrix defaults.
def resolvedMinecraftVersion = matrixTarget.minecraft
def resolvedNeoForgeVersion = providers.gradleProperty('neoforge_version').getOrElse(matrixTarget.neoforge)

def pluginNameForFile = (modInfo.name as String).replaceAll(/[^A-Za-z0-9]/, '')
def mcVersionForFile = (resolvedMinecraftVersion as String).replace('.', '-')
def neoForgeVersionForFile = (resolvedNeoForgeVersion as String).replace('.', '-')

dependencies {
    implementation project(':permaclicker-common')
    implementation project(':permaclicker-client')
    implementation turtleLibDependency
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.1'
}

tasks.named('processResources', ProcessResources) {
    inputs.property('mod_id', modInfo.id)
    inputs.property('mod_name', modInfo.name)
    inputs.property('minecraft_version', resolvedMinecraftVersion)
    inputs.property('neoforge_version', resolvedNeoForgeVersion)
    inputs.property('java_language_version', resolvedJavaLanguageVersion)
    inputs.property('turtlelib_version', modInfo.turtleLibDependencyVersion)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            file                  : [jarVersion: project.version],
            mod_id                : modInfo.id,
            mod_name              : modInfo.name,
            minecraft_version     : resolvedMinecraftVersion,
            neoforge_version      : resolvedNeoForgeVersion,
            java_language_version : resolvedJavaLanguageVersion,
            turtlelib_version     : modInfo.turtleLibDependencyVersion
        ])
    }
}

def commonMainOutput = project(':permaclicker-common').sourceSets.main.output
def clientMainOutput = project(':permaclicker-client').sourceSets.main.output
def permaClickerDistDir = layout.projectDirectory.dir('../dist')
def permaClickerDistSourcesDir = layout.projectDirectory.dir('../dist/sources')
def modLicenseFile = file('../LICENSE')

neoForge {
    version = resolvedNeoForgeVersion

    mods {
        permaclicker {
            sourceSet sourceSets.main
        }
    }
}

tasks.test {
    useJUnitPlatform()
}

tasks.named('jar') {
    from(commonMainOutput)
    from(clientMainOutput)
    from(modLicenseFile) {
        into 'META-INF'
        rename { 'LICENSE' }
    }

    destinationDirectory = permaClickerDistDir
    archiveFileName = "${pluginNameForFile}_${project.version}_MC-${mcVersionForFile}_NEOFORGE_${neoForgeVersionForFile}.jar"
    manifest {
        attributes(
            'Implementation-Title': modInfo.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'hrobasti'
        )
    }
}

tasks.named('sourcesJar') {
    from(modLicenseFile) {
        into 'META-INF'
        rename { 'LICENSE' }
    }

    destinationDirectory = permaClickerDistSourcesDir
    archiveFileName = "${pluginNameForFile}_${project.version}_MC-${mcVersionForFile}_NEOFORGE_${neoForgeVersionForFile}-source.jar"
}

// The jar / sourcesJar tasks already write directly into dist (and dist/sources) via
// destinationDirectory, so no extra export/copy step is needed. Separate Copy-into-dist
// tasks would also trip Gradle 9.6+ overlapping-output validation because both loader
// subprojects share the same mods/permaclicker-mod/dist directory.
