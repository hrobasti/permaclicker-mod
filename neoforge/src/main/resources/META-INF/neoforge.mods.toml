[[dependencies.permaclicker]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.permaclicker]]
modId="turtlelib"
type="required"
versionRange="[${turtlelib_version},)"
