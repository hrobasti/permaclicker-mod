Keeps your attack going while you're AFK: continuous mining for block farms, or full-strength hits for mob and animal farms. For single-player or servers that allow it.
Source: https://github.com/hrobasti/permaclicker-mod
GitHub Sponsors: https://github.com/sponsors/hrobasti
Ko-Fi: https://ko-fi.com/kroet
'''

[[dependencies.permaclicker]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
