plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java-library'
}

apply from: file('../gradle/matrix-defaults.gradle')
apply from: file('../gradle/java-conventions.gradle')
apply from: file('../gradle/mod-info.gradle')
apply from: file('../gradle/turtlelib-dependency.gradle')
def matrixTarget = resolveMatrixTarget('minecraft_version')
applyJavaConventions(matrixTarget)

// Loader-neutral client-side runtime code that genuinely needs Minecraft classes (unlike
// :permaclicker-common, which stays Minecraft-free by design). Compiled here against a
// Fabric-shaped Minecraft classpath and bundled as plain classes into both the Fabric and
// NeoForge loader jars — see mods/permaclicker-mod/TODO-architecture-review.md (F1) for why
// Fabric's (narrower) classpath is the safe compile target for code shared with NeoForge.
// Explicit -P values (passed per target by the matrix release builds) win over the matrix defaults.
def resolvedMinecraftVersion = matrixTarget.minecraft
def resolvedFabricLoaderVersion = providers.gradleProperty('fabric_loader_version').getOrElse(matrixTarget.fabricLoader)
def resolvedFabricApiVersion = providers.gradleProperty('fabric_api_version').getOrElse(matrixTarget.fabricApi)

dependencies {
    minecraft "com.mojang:minecraft:${resolvedMinecraftVersion}"

    // compileOnly: only needed so Loom's compile-time classpath fully resolves (Fabric API
    // injects interfaces into vanilla classes at compile time); this module makes no direct
    // Fabric API calls and must not leak these as transitive runtime deps to NeoForge consumers.
    compileOnly "net.fabricmc:fabric-loader:${resolvedFabricLoaderVersion}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${resolvedFabricApiVersion}"

    api project(':permaclicker-common')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.1'
}

tasks.test {
    useJUnitPlatform()
}
