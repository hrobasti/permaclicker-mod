plugins {
    id 'java-library'
}

apply from: file('../gradle/matrix-defaults.gradle')
apply from: file('../gradle/java-conventions.gradle')
apply from: file('../gradle/mod-info.gradle')
apply from: file('../gradle/turtlelib-dependency.gradle')
applyJavaConventions(resolveMatrixTarget('minecraft_version'))

repositories {
    // Declaring project repositories (TurtleLib above) disables the settings-level ones here.
    mavenCentral()
}

dependencies {
    api turtleLibDependency
    // The config store uses Gson directly; the TurtleLib release asset carries no dependency metadata.
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.1'
}

tasks.test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources) {
    from(layout.projectDirectory.file('../update-sources.properties')) {
        rename { 'permaclicker-update-sources.properties' }
    }
}
